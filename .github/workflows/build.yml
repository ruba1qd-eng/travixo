name: Build APK and Web

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.22.0

      - name: Generate project files
        run: flutter create . --platforms android,web --org com.travixo --project-name travel_in_app

      - name: Remove auto test file
        run: rm -rf test

      - name: Brand as Travixo (Android + Web)
        run: |
          sed -i 's/android:label=".*"/android:label="Travixo"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<title>.*</title>|<title>Travixo</title>|' web/index.html
          sed -i 's/"name": ".*"/"name": "Travixo"/' web/manifest.json
          sed -i 's/"short_name": ".*"/"short_name": "Travixo"/' web/manifest.json
          sed -i 's/"theme_color": ".*"/"theme_color": "#FF8C1A"/' web/manifest.json
          sed -i 's/apple-mobile-web-app-title" content="[^"]*"/apple-mobile-web-app-title" content="Travixo"/' web/index.html

      - name: Install dependencies
        run: flutter pub get

      - name: Find Dart errors
        run: flutter analyze --no-pub || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travixo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web
        run: flutter build web --release --base-href /travixo/

      - name: Copy APK into Web for direct download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/web/travixo.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
